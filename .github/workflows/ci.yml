name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        dockerfile: [Dockerfile.api, Dockerfile.airflow, Dockerfile.dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} -t ci-check .
