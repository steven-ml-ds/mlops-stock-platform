[project]
name = "mlops-stock-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "lightgbm>=4.3",
    "matplotlib>=3.10.9",
    "mlflow>=2.17",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.49.0",
    "yfinance>=0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
