services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0 --port 5000
    ports:
      - "5001:5000"   # host 5001: macOS AirPlay squats on 5000
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: airflow standalone
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # local demo only: skip login entirely
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /opt/airflow/src
    ports:
      - "8081:8080"   # host 8081: stock-etl-pipeline's Airflow owns 8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Reach the stock-etl-pipeline's MinIO over the shared umbrella network (service name).
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    networks: [default, stock-net]
    volumes:
      - ./data:/srv/data   # feature building reads the OHLCV cache
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      api:
        condition: service_started
      mlflow:
        condition: service_started
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_URL: http://api:8000
      MINIO_ENDPOINT: minio:9000   # ETL store over the shared network
    ports:
      - "8501:8501"
    networks: [default, stock-net]
    restart: unless-stopped

volumes:
  mlflow-data:
  postgres-db:

# Shared network with the stock-etl-pipeline stack so api/dashboard can resolve its `minio`
# by service name. External: create once with `docker network create stock-net` (the umbrella
# compose / its README documents this). A standalone `docker compose up` here still works — the
# ETL source is optional and fetch_all falls back to the CSV cache when MinIO is unreachable.
networks:
  default:
  stock-net:
    external: true
